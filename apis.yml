apis:
- name: PANGAEA Data Download Service - Filter by DOI
  description: >-
    REST service for retrieving tabular dataset data filtered by dataset DOI and parameter values. Supports
    column selection, value filtering with range queries, and multiple filter criteria with AND/OR logic.
    Returns tab-delimited data files.
  humanURL: https://ws.pangaea.de/dds-fdp/
  baseURL: https://ws.pangaea.de/dds-fdp/rest/panquery
  tags:
  - Data Download
  - Tabular Data
  - DOI
  - Filtering
  properties:
  - type: Documentation
    url: https://ws.pangaea.de/dds-fdp/
  contact:
  - FN: PANGAEA Technical Support
    email: tech@pangaea.de
- name: PANGAEA Data Download Service - Filter by Geo Parameters
  description: >-
    REST service for retrieving geoscientific measurements filtered by geographic bounding box, temporal
    range, depth constraints, and PANGAEA parameter IDs. Ideal for extracting cross-dataset measurements
    from specific ocean regions, time periods, or depth intervals.
  humanURL: https://ws.pangaea.de/dds-fgp/
  baseURL: https://ws.pangaea.de/dds-fgp/rest/dwhquery
  tags:
  - Data Download
  - Geospatial
  - Bounding Box
  - Ocean Data
  - Depth Filtering
  properties:
  - type: Documentation
    url: https://ws.pangaea.de/dds-fgp/
  contact:
  - FN: PANGAEA Technical Support
    email: tech@pangaea.de
- name: PANGAEA Bathymetry WMS
  description: >-
    OGC-compliant Web Map Service providing bathymetric (ocean depth) map layers for integration into
    GIS software. Hosted by AWI and based on PANGAEA bathymetry data collected from scientific expeditions.
  humanURL: https://www.pangaea.de/tools/
  baseURL: https://maps.awi.de/services/common/pangaea_bathymetry/wms
  tags:
  - WMS
  - Bathymetry
  - OGC
  - GIS
  - Ocean Depth
  properties:
  - type: Documentation
    url: https://www.pangaea.de/tools/
  contact:
  - FN: PANGAEA Technical Support
    email: tech@pangaea.de
- name: PANGAEA Term Dictionary API
  description: >-
    Elasticsearch-backed REST API for querying PANGAEA's controlled vocabulary and term dictionary used
    for classifying datasets by topic, parameter, and method.
  humanURL: https://ws.pangaea.de/
  baseURL: https://ws.pangaea.de/es/pangaea-terms/term/_search
  tags:
  - Controlled Vocabulary
